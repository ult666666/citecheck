name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Run tests with coverage
        run: uv run pytest --cov=citecheck --cov-report=term-missing --cov-fail-under=90

      # No API key is configured anywhere in this workflow: everything below
      # replays the hand-written synthetic fixtures in eval/fixtures.
      - name: Smoke-test the command-line interface offline
        run: |
          uv run citecheck --version
          uv run citecheck index examples/handbook
          uv run citecheck search "hotel limit"
          uv run citecheck ask "What is the deadline for submitting an expense?"
          uv run citecheck ask --dry-run "What is the deadline for submitting an expense?"
          uv run citecheck eval
